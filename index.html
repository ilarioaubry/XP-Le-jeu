<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Doggy Party">
  <meta name="theme-color" content="#07040c">
  <meta name="format-detection" content="telephone=no">
  <title>Octave Tycoon : La Quête de Laure — Doggy Party</title>
  <meta name="description" content="Idle Tycoon en Pixel Art : Octave et sa meute récoltent des pizzas dans la coloc de Montpellier pour impressionner Laure.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <!-- Si quelque chose plante sur un téléphone, l'erreur s'affiche en bas de l'écran -->
  <script>
    (function () {
      function show(msg) {
        var b = document.getElementById('errBox');
        if (!b) {
          b = document.createElement('div'); b.id = 'errBox';
          b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:999;background:#8c1023;color:#fff;font:14px monospace;padding:8px 10px;max-height:40%;overflow:auto';
          b.onclick = function () { b.style.display = 'none'; };
          document.body.appendChild(b);
        }
        b.style.display = 'block';
        b.textContent = 'Oups, une erreur : ' + msg + ' (touche pour fermer)';
      }
      window.addEventListener('error', function (e) {
        show((e.message || 'inconnue') + (e.filename ? ' [' + String(e.filename).split('/').pop().split('?')[0] + ':' + e.lineno + ']' : ''));
      });
      window.addEventListener('unhandledrejection', function (e) { show(String(e.reason)); });
    })();
  </script>
  <!-- ============ EN-TÊTE ============ -->
  <header class="topbar pixel-box">
    <div class="brand">
      <span class="studio">DOGGY PARTY présente</span>
      <h1>OCTAVE TYCOON</h1>
      <span class="subtitle">La Quête de Laure</span>
    </div>
    <div class="stats">
      <div class="stat stat-main">
        <img id="pizzaIcon" class="px-icon" alt="">
        <span id="pizzaCount">0</span>
      </div>
      <div class="stat-row">
        <span class="stat"><span data-ui="label_pps">Pizzas / seconde :</span> <b id="ppsCount">0</b></span>
      </div>
    </div>
  </header>

  <!-- ============ CORPS ============ -->
  <main class="layout">
    <section class="stage-col">
      <div class="stage pixel-box" id="stage">
        <div class="stage-inner" id="stageInner">
          <canvas id="room" width="320" height="180" tabindex="0" aria-label="Le salon de la coloc d'Octave à Montpellier. Touche un animal pour qu'il rapporte des pizzas !"></canvas>
          <div id="floaters" class="floaters"></div>
          <div id="boostBanner" class="boost-banner hidden"><span id="boostText">🍺 TOURNÉE GÉNÉRALE x3</span></div>

        </div>

        <!-- Boîte de dialogue RPG -->
        <div id="dialog" class="rpg-dialog hidden" role="dialog" aria-live="polite">
          <img id="dialogPortrait" class="dialog-portrait" alt="">
          <div class="dialog-body">
            <div id="dialogName" class="dialog-name">???</div>
            <p id="dialogText" class="dialog-text"></p>
          </div>
          <span class="dialog-next">▼</span>
        </div>
      </div>

      <div class="under-stage">
        <div class="laure-meter pixel-box">
          <span class="meter-label" data-ui="label_coeur">♥ Cœur de Laure</span>
          <div class="meter"><div id="laureBar" class="meter-fill"></div></div>
          <span id="laurePct" class="meter-pct">0%</span>
        </div>
        <button id="btnOliver" class="px-btn oliver-btn hidden">
          <img id="beerIcon" class="px-icon" alt="">
          <span id="oliverLabel">TOURNÉE GÉNÉRALE</span>
        </button>
      </div>
    </section>

    <!-- ============ BOUTIQUE ============ -->
    <aside class="shop pixel-box">
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="animals" role="tab"><span data-ui="onglet_meute">MEUTE</span></button>
        <button class="tab" data-tab="managers" role="tab"><span data-ui="onglet_coloc">COLOC</span></button>
        <button class="tab" data-tab="boosts" role="tab"><span data-ui="onglet_boosts">BOOSTS</span></button>
      </nav>
      <div class="buy-mode" id="buyMode">
        <span data-ui="label_achat">Achat :</span>
        <button class="px-btn tiny active" data-qty="1">x1</button>
        <button class="px-btn tiny" data-qty="10">x10</button>
        <button class="px-btn tiny" data-qty="max">MAX</button>
      </div>
      <div class="tab-panel" id="panel-animals"></div>
      <div class="tab-panel hidden" id="panel-managers"></div>
      <div class="tab-panel hidden" id="panel-boosts"></div>
    </aside>
  </main>

  <!-- ============ FIN DU JEU ============ -->
  <div id="victory" class="modal hidden">
    <div class="modal-box pixel-box">
      <h2 data-ui="victoire_titre">♥ VICTOIRE ♥</h2>
      <div class="victory-portraits">
        <img id="vicOctave" alt="Octave">
        <img id="vicHeart" alt="♥" class="vic-heart">
        <img id="vicLaure" alt="Laure">
      </div>
      <p data-ui="victoire_texte">Laure a refermé son Bourdieu. Elle te regarde. Elle sourit (un peu). Elle accepte une part de pizza.</p>
      <p id="vicStats" class="vic-stats"></p>
      <button id="btnContinue" class="px-btn" data-ui="victoire_bouton">CONTINUER LA PARTY</button>
    </div>
  </div>

  <!-- ============ ANIMATION D'UNLOCK ============ -->
  <div id="unlock" class="unlock hidden" role="dialog" aria-live="assertive">
    <div class="unlock-rays"></div>
    <div id="unlockSparks" class="unlock-sparks"></div>
    <div class="unlock-card pixel-box">
      <div id="unlockKicker" class="unlock-kicker">NOUVEAU !</div>
      <img id="unlockImg" class="unlock-img" alt="">
      <div id="unlockName" class="unlock-name"></div>
      <div id="unlockSub" class="unlock-sub"></div>
      <p id="unlockQuote" class="unlock-quote"></p>
      <div class="unlock-tap" data-ui="unlock_continuer">TOUCHE POUR CONTINUER</div>
    </div>
  </div>

  <script src="js/sprites.js?v=4"></script>
  <script src="js/characters.js?v=4"></script>
  <script src="js/data.js?v=4"></script>
  <script src="js/textes.js?v=4"></script>
  <script src="js/audio.js?v=4"></script>
  <script src="js/room.js?v=4"></script>
  <script src="js/game.js?v=4"></script>
</body>
</html>
